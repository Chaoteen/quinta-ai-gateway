name: Commercial security gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: commercial-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.11'
      - name: Prepare compile-only embedded assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for theme in ('default', 'classic'):
              p = Path('web') / theme / 'dist' / 'index.html'
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text('<!doctype html><title>Compile test only</title>')
          PY
      - run: go test . ./common/... ./constant/... ./controller/... ./dto/... ./i18n/... ./logger/... ./middleware/... ./model/... ./oauth/... ./pkg/... ./relay/... ./router/... ./service/... ./setting/... ./types/...
      - run: go test -race ./service ./middleware -run 'TestSecurity' -count=1
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 . ./common/... ./constant/... ./controller/... ./dto/... ./i18n/... ./logger/... ./middleware/... ./model/... ./oauth/... ./pkg/... ./relay/... ./router/... ./service/... ./setting/... ./types/...
      - name: Full-history secret scan (redacted)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --log-opts="--all"
  database-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        driver: [postgres, mysql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: security_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable_ci_password
          MYSQL_DATABASE: security_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pdisposable_ci_password" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.11'
      - name: PostgreSQL concurrent payment and voucher tests
        if: matrix.driver == 'postgres'
        env:
          SECURITY_TEST_DB_DRIVER: postgres
          SECURITY_ALLOW_DISPOSABLE_DB: 'true'
          SECURITY_TEST_DB_DSN: host=localhost user=postgres password=disposable_ci_password dbname=security_test port=5432 sslmode=disable
        run: go test ./service -run '^TestSecurity' -count=1
      - name: MySQL concurrent payment and voucher tests
        if: matrix.driver == 'mysql'
        env:
          SECURITY_TEST_DB_DRIVER: mysql
          SECURITY_ALLOW_DISPOSABLE_DB: 'true'
          SECURITY_TEST_DB_DSN: root:disposable_ci_password@tcp(localhost:3306)/security_test?parseTime=true
        run: go test ./service -run '^TestSecurity' -count=1
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/default
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test scripts/commercial-money.test.mjs
      - run: bun test scripts/base-path.test.mjs scripts/base-path-build.test.mjs scripts/usage-log-access.test.mjs
      - run: bun run build
      - run: bun audit --audit-level=high
  classic-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/classic
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun audit --audit-level=high
